{
    "device.node_id": "aws-honeypot-01",
    "device.name": "ip-10-0-1-215",

    "logging.json": true,
    "logging.file": "/var/tmp/opencanary.log",

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",

    "http.enabled": true,
    "http.port": 8080,
    "http.banner": "Apache/2.4.52 (Ubuntu)",
    "http.skin": "nasLogin",

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.5.47-0ubuntu0.14.04.1",

    "vnc.enabled": true,
    "vnc.port": 5900,

    "ssh.enabled": false,
    "telnet.enabled": false,
    "rdp.enabled": false,
    "smb.enabled": false,
    "redis.enabled": false,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {"format": "%(message)s"}
            },
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/tmp/opencanary.log"
                }
            }
        }
    }
}
